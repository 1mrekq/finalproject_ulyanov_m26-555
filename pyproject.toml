[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "CLI-платформа виртуального портфеля фиатных и криптовалют с локальным кэшем курсов и Parser Service."
readme = "README.md"
authors = [
    { name = "Ulyanov Oleg", email = "imrekq@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.32.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
exchange_rates_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
base_currency = "USD"
log_file = "logs/actions.log"
parser_log_file = "logs/parser.log"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 5
log_format = "text"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
